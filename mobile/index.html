<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Orion AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --bg: #09090B; --surface: #18181B; --border: #27272A; --text: #E4E4E7; --text-dim: #71717A; --accent: #7C3AED; --accent-light: #A78BFA; --user-bg: #6D28D9; --error: #EF4444; --success: #10B981; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    header { padding: 14px 16px; border-bottom: 1px solid var(--border); background: var(--surface); display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--error); transition: background 0.3s; }
    .status-dot.connected { background: var(--success); }
    .status-dot.connecting { background: #F59E0B; animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: 0.5; } }
    header h1 { font-size: 17px; font-weight: 600; }
    header .subtitle { font-size: 11px; color: var(--text-dim); margin-left: auto; }

    .setup-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; gap: 16px; }
    .setup-screen h2 { font-size: 20px; font-weight: 600; }
    .setup-screen p { font-size: 13px; color: var(--text-dim); text-align: center; max-width: 280px; }
    .setup-screen input { width: 100%; max-width: 320px; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; color: var(--text); font-size: 15px; outline: none; text-align: center; font-family: monospace; }
    .setup-screen input:focus { border-color: var(--accent); }
    .setup-screen button { width: 100%; max-width: 320px; padding: 12px; border-radius: 12px; border: none; background: var(--accent); color: white; font-size: 15px; font-weight: 600; cursor: pointer; }
    .setup-screen .recent { margin-top: 12px; width: 100%; max-width: 320px; }
    .setup-screen .recent h3 { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .setup-screen .recent-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 6px; cursor: pointer; }
    .setup-screen .recent-item:active { background: var(--accent); border-color: var(--accent); }
    .setup-screen .recent-item .ip { font-family: monospace; font-size: 13px; font-weight: 500; }
    .setup-screen .recent-item .remove { margin-left: auto; color: var(--text-dim); font-size: 18px; padding: 0 4px; }

    .chat-screen { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .chat-screen.hidden { display: none; }

    .toolbar { display: flex; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0; overflow-x: auto; }
    .toolbar button { flex-shrink: 0; padding: 7px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-size: 12px; cursor: pointer; white-space: nowrap; }
    .toolbar button:active { background: var(--accent); border-color: var(--accent); }

    .messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; -webkit-overflow-scrolling: touch; }
    .msg { max-width: 82%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.5; word-break: break-word; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } }
    .msg.user { align-self: flex-end; background: var(--user-bg); color: white; border-bottom-right-radius: 4px; }
    .msg.assistant { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .msg.system { align-self: center; background: transparent; color: var(--text-dim); font-size: 12px; padding: 4px 12px; }
    .msg.error { align-self: center; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: var(--error); font-size: 12px; }

    .thinking { display: flex; gap: 4px; padding: 12px 16px; }
    .thinking span { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-light); animation: bounce 1.4s infinite; }
    .thinking span:nth-child(2) { animation-delay: 0.2s; }
    .thinking span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }

    .input-area { padding: 10px 14px; border-top: 1px solid var(--border); background: var(--surface); flex-shrink: 0; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
    .input-row { display: flex; gap: 8px; align-items: flex-end; }
    .input-row textarea { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; color: var(--text); font-size: 15px; font-family: inherit; resize: none; max-height: 100px; outline: none; transition: border-color 0.2s; }
    .input-row textarea:focus { border-color: var(--accent); }
    .input-row button { width: 40px; height: 40px; border-radius: 12px; border: none; background: var(--accent); color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .input-row button:disabled { opacity: 0.4; }
    .input-row button svg { width: 18px; height: 18px; }

    .screenshot-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; flex-direction: column; align-items: center; justify-content: center; padding: 16px; }
    .screenshot-overlay.active { display: flex; }
    .screenshot-overlay img { max-width: 100%; max-height: 75vh; border-radius: 10px; border: 1px solid var(--border); }
    .screenshot-overlay .close-btn { position: absolute; top: 16px; right: 16px; width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--surface); color: var(--text); font-size: 20px; cursor: pointer; }
    .screenshot-overlay .refresh-btn { margin-top: 12px; padding: 10px 20px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 14px; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <div class="status-dot" id="statusDot"></div>
    <h1>Orion AI</h1>
    <span class="subtitle" id="subtitle">Sin conectar</span>
  </header>

  <div class="setup-screen" id="setupScreen">
    <h2>Conectar a PC</h2>
    <p>Ingresá la IP de tu PC donde corre Orion AI</p>
    <input type="text" id="ipInput" placeholder="192.168.1.100:3847" inputmode="url">
    <button onclick="connectToPC()">Conectar</button>
    <div class="recent" id="recentSection" style="display:none">
      <h3>Conexiones recientes</h3>
      <div id="recentList"></div>
    </div>
  </div>

  <div class="chat-screen hidden" id="chatScreen">
    <div class="toolbar">
      <button onclick="requestScreenshot()">Ver pantalla PC</button>
      <button onclick="sendQuick('Que tienes abierto?')">Que hay abierto?</button>
      <button onclick="sendQuick('Toma un screenshot y describelo')">Capturar pantalla</button>
      <button onclick="disconnect()">Desconectar</button>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <div class="input-row">
        <textarea id="input" placeholder="Ej: Abre YouTube..." rows="1"></textarea>
        <button id="sendBtn" onclick="send()" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="screenshot-overlay" id="screenshotOverlay">
    <button class="close-btn" onclick="closeScreenshot()">&times;</button>
    <img id="screenshotImg" src="" alt="Pantalla">
    <button class="refresh-btn" onclick="requestScreenshot()">Actualizar</button>
  </div>

  <script>
    let ws = null, reconnectTimer = null, currentUrl = '';
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const statusDot = document.getElementById('statusDot');
    const subtitle = document.getElementById('subtitle');
    const setupScreen = document.getElementById('setupScreen');
    const chatScreen = document.getElementById('chatScreen');
    const ipInput = document.getElementById('ipInput');

    const STORAGE_KEY = 'orion_recent_hosts';

    function getRecent() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch { return []; }
    }
    function saveRecent(url) {
      let recent = getRecent().filter(r => r !== url);
      recent.unshift(url);
      if (recent.length > 5) recent = recent.slice(0, 5);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(recent));
    }
    function removeRecent(url) {
      const recent = getRecent().filter(r => r !== url);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(recent));
      showRecent();
    }
    function showRecent() {
      const recent = getRecent();
      const section = document.getElementById('recentSection');
      const list = document.getElementById('recentList');
      if (recent.length === 0) { section.style.display = 'none'; return; }
      section.style.display = 'block';
      list.innerHTML = recent.map(url =>
        `<div class="recent-item" onclick="connectToUrl('${url}')">
          <span class="ip">${url}</span>
          <span class="remove" onclick="event.stopPropagation();removeRecent('${url}')">&times;</span>
        </div>`
      ).join('');
    }

    function connectToUrl(url) {
      ipInput.value = url;
      connectToPC();
    }

    function connectToPC() {
      let url = ipInput.value.trim();
      if (!url) return;
      if (!url.startsWith('http')) url = 'http://' + url;
      if (!url.includes(':')) url += ':3847';

      currentUrl = url;
      saveRecent(url);

      setupScreen.classList.add('hidden');
      chatScreen.classList.remove('hidden');
      messagesEl.innerHTML = '';

      doConnect(url);
    }

    function doConnect(url) {
      if (ws) { ws.close(); ws = null; }
      const wsUrl = url.replace('http', 'ws');
      ws = new WebSocket(wsUrl);
      statusDot.className = 'status-dot connecting';
      subtitle.textContent = 'Conectando...';

      ws.onopen = () => {
        statusDot.className = 'status-dot connected';
        subtitle.textContent = 'Conectado';
        sendBtn.disabled = false;
        if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
      };

      ws.onmessage = (e) => {
        try { handleResponse(JSON.parse(e.data)); } catch {}
      };

      ws.onclose = () => {
        statusDot.className = 'status-dot';
        subtitle.textContent = 'Desconectado';
        sendBtn.disabled = true;
        reconnectTimer = setTimeout(() => {
          if (currentUrl) doConnect(currentUrl);
        }, 3000);
      };

      ws.onerror = () => {};
    }

    function handleResponse(d) {
      removeThinking();
      if (d.type === 'chat') addMessage('assistant', d.content);
      else if (d.type === 'screenshot') showScreenshot(d.image);
      else if (d.type === 'error') addMessage('error', d.error || 'Error');
      else if (d.type === 'status') addMessage('system', d.content);
    }

    function addMessage(r, c) {
      const d = document.createElement('div');
      d.className = 'msg ' + r;
      d.textContent = c;
      messagesEl.appendChild(d);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addThinking() {
      const d = document.createElement('div');
      d.className = 'thinking'; d.id = 'thinking';
      d.innerHTML = '<span></span><span></span><span></span>';
      messagesEl.appendChild(d);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function removeThinking() {
      const e = document.getElementById('thinking');
      if (e) e.remove();
    }

    function send() {
      const t = inputEl.value.trim();
      if (!t || !ws || ws.readyState !== WebSocket.OPEN) return;
      addMessage('user', t);
      addThinking();
      ws.send(JSON.stringify({ type: 'chat', content: t }));
      inputEl.value = '';
      inputEl.style.height = 'auto';
      sendBtn.disabled = true;
    }

    function sendQuick(t) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      addMessage('user', t);
      addThinking();
      ws.send(JSON.stringify({ type: 'chat', content: t }));
    }

    function requestScreenshot() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      addThinking();
      ws.send(JSON.stringify({ type: 'screenshot-request' }));
    }

    function showScreenshot(b) {
      removeThinking();
      document.getElementById('screenshotImg').src = 'data:image/jpeg;base64,' + b;
      document.getElementById('screenshotOverlay').classList.add('active');
    }

    function closeScreenshot() {
      document.getElementById('screenshotOverlay').classList.remove('active');
    }

    function disconnect() {
      if (ws) ws.close();
      ws = null;
      currentUrl = '';
      chatScreen.classList.add('hidden');
      setupScreen.classList.remove('hidden');
      showRecent();
    }

    inputEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });
    inputEl.addEventListener('input', () => {
      sendBtn.disabled = inputEl.value.trim().length === 0 || !ws || ws.readyState !== WebSocket.OPEN;
    });

    showRecent();
  </script>
</body>
</html>
