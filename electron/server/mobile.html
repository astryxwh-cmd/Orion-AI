<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Orion AI - Control Remoto</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg: #09090B;
      --surface: #18181B;
      --border: #27272A;
      --text: #E4E4E7;
      --text-dim: #71717A;
      --accent: #7C3AED;
      --accent-light: #A78BFA;
      --user-bg: #6D28D9;
      --error: #EF4444;
      --success: #10B981;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }

    header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--error);
      transition: background 0.3s;
    }
    .status-dot.connected { background: var(--success); }
    .status-dot.connecting { background: #F59E0B; animation: pulse 1s infinite; }

    @keyframes pulse { 50% { opacity: 0.5; } }

    header h1 {
      font-size: 16px;
      font-weight: 600;
    }

    header .subtitle {
      font-size: 11px;
      color: var(--text-dim);
      margin-left: auto;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    .toolbar button {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .toolbar button:active {
      background: var(--accent);
      border-color: var(--accent);
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
    }

    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } }

    .msg.user {
      align-self: flex-end;
      background: var(--user-bg);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .msg.assistant {
      align-self: flex-start;
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .msg.system {
      align-self: center;
      background: transparent;
      color: var(--text-dim);
      font-size: 12px;
      padding: 4px 12px;
    }

    .msg.error {
      align-self: center;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: var(--error);
      font-size: 12px;
    }

    .msg img {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 8px;
    }

    .msg .tool-calls {
      margin-top: 8px;
      padding: 6px 10px;
      background: rgba(124, 58, 237, 0.1);
      border-radius: 8px;
      font-size: 11px;
      color: var(--accent-light);
    }

    .thinking {
      display: flex;
      gap: 4px;
      padding: 12px 16px;
    }
    .thinking span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-light);
      animation: bounce 1.4s infinite;
    }
    .thinking span:nth-child(2) { animation-delay: 0.2s; }
    .thinking span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }

    .input-area {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    .input-row textarea {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      resize: none;
      max-height: 120px;
      outline: none;
      transition: border-color 0.2s;
      -webkit-user-select: text;
      user-select: text;
    }
    .input-row textarea:focus {
      border-color: var(--accent);
    }

    .input-row button {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.2s;
    }
    .input-row button:disabled {
      opacity: 0.4;
    }
    .input-row button svg {
      width: 18px;
      height: 18px;
    }

    .screenshot-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .screenshot-overlay.active { display: flex; }
    .screenshot-overlay img {
      max-width: 100%;
      max-height: 80vh;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .screenshot-overlay .close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: var(--surface);
      color: var(--text);
      font-size: 20px;
      cursor: pointer;
    }
    .screenshot-overlay .refresh-btn {
      margin-top: 12px;
      padding: 10px 20px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <div class="status-dot" id="statusDot"></div>
    <h1>Orion AI</h1>
    <span class="subtitle" id="subtitle">Conectando...</span>
  </header>

  <div class="toolbar">
    <button onclick="requestScreenshot()">Ver pantalla PC</button>
    <button onclick="sendQuick('¿Qué tienes abierto?')">¿Qué hay abierto?</button>
    <button onclick="sendQuick('Toma un screenshot y descríbelo')">Capturar pantalla</button>
  </div>

  <div class="messages" id="messages">
    <div class="msg system">Conectando con tu PC...</div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <textarea id="input" placeholder="Ej: Abre YouTube..." rows="1"
        oninput="autoResize(this)"></textarea>
      <button id="sendBtn" onclick="send()" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="screenshot-overlay" id="screenshotOverlay">
    <button class="close-btn" onclick="closeScreenshot()">×</button>
    <img id="screenshotImg" src="" alt="Pantalla de la PC">
    <button class="refresh-btn" onclick="requestScreenshot()">Actualizar</button>
  </div>

  <script>
    let ws = null;
    let reconnectTimer = null;
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const statusDot = document.getElementById('statusDot');
    const subtitle = document.getElementById('subtitle');

    function connect() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${location.host}`);
      statusDot.className = 'status-dot connecting';
      subtitle.textContent = 'Conectando...';

      ws.onopen = () => {
        statusDot.className = 'status-dot connected';
        subtitle.textContent = 'Conectado a tu PC';
        sendBtn.disabled = false;
        if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          handleResponse(data);
        } catch {}
      };

      ws.onclose = () => {
        statusDot.className = 'status-dot';
        subtitle.textContent = 'Desconectado';
        sendBtn.disabled = true;
        reconnectTimer = setTimeout(connect, 3000);
      };

      ws.onerror = () => {};
    }

    function handleResponse(data) {
      removeThinking();

      if (data.type === 'chat') {
        addMessage('assistant', data.content);
      } else if (data.type === 'screenshot') {
        showScreenshot(data.image);
      } else if (data.type === 'error') {
        addMessage('error', data.error || 'Error desconocido');
      } else if (data.type === 'status') {
        addMessage('system', data.content);
      }
    }

    function addMessage(role, content) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.textContent = content;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addThinking() {
      const div = document.createElement('div');
      div.className = 'thinking';
      div.id = 'thinking';
      div.innerHTML = '<span></span><span></span><span></span>';
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function removeThinking() {
      const el = document.getElementById('thinking');
      if (el) el.remove();
    }

    function send() {
      const text = inputEl.value.trim();
      if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

      addMessage('user', text);
      addThinking();

      ws.send(JSON.stringify({ type: 'chat', content: text }));
      inputEl.value = '';
      inputEl.style.height = 'auto';
    }

    function sendQuick(text) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      addMessage('user', text);
      addThinking();
      ws.send(JSON.stringify({ type: 'chat', content: text }));
    }

    function requestScreenshot() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      addThinking();
      ws.send(JSON.stringify({ type: 'screenshot-request' }));
    }

    function showScreenshot(base64) {
      removeThinking();
      const img = document.getElementById('screenshotImg');
      img.src = `data:image/jpeg;base64,${base64}`;
      document.getElementById('screenshotOverlay').classList.add('active');
    }

    function closeScreenshot() {
      document.getElementById('screenshotOverlay').classList.remove('active');
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px';
      sendBtn.disabled = el.value.trim().length === 0;
    }

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    inputEl.addEventListener('input', () => {
      sendBtn.disabled = inputEl.value.trim().length === 0;
    });

    connect();
  </script>
</body>
</html>
